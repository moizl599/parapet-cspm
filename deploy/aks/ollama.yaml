# Ollama (local LLM) — CPU deployment with a persistent model volume.
# qwen2.5:7b needs roughly 6-8 GB RAM; size your node pool accordingly.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: parapet
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi          # Azure Disk (default on AKS)
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: parapet
  labels: { app: ollama }
spec:
  replicas: 1
  strategy: { type: Recreate }           # RWO disk can attach to one pod at a time
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 10Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            tcpSocket: { port: 11434 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: parapet
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
