# AWS read-only credentials for Parapet's scans.
# DO NOT commit a filled-in copy. Prefer creating the secret imperatively:
#
#   kubectl -n parapet create secret generic parapet-aws \
#     --from-literal=AWS_ACCESS_KEY_ID=AKIA... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=AWS_REGION=us-east-1 \
#     --from-literal=AWS_DEFAULT_REGION=us-east-1
#
# ...or, better, mount from Azure Key Vault via the Secrets Store CSI driver.
# This file is only a template to show the expected keys.
apiVersion: v1
kind: Secret
metadata:
  name: parapet-aws
  namespace: parapet
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  AWS_REGION: "us-east-1"
  AWS_DEFAULT_REGION: "us-east-1"
